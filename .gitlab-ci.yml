stages:
  - test
  - ui-tests
  - build

image: eclipse-temurin:17-jdk-jammy

variables:
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_SDK_TOOLS: "9477386"
  SUPABASE_URL: $SUPABASE_URL
  SUPABASE_KEY: $SUPABASE_KEY

before_script:
  - apt-get --quiet update --yes
  - apt-get --quiet install --yes wget unzip
  - export ANDROID_HOME="${PWD}/android-sdk-root"
  - install -d $ANDROID_HOME
  - export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/tools/bin:$ANDROID_HOME/platform-tools
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || wget --no-verbose --output-document=$ANDROID_HOME/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || unzip -q -d "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/cmdline-tools.zip"
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || mv -T "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/tools"
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || yes | sdkmanager --licenses > /dev/null || true
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || sdkmanager "platforms;android-${ANDROID_COMPILE_SDK}"
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || sdkmanager "platform-tools"
  - test -d "$ANDROID_HOME/cmdline-tools/tools/bin" || sdkmanager "build-tools;${ANDROID_BUILD_TOOLS}"
  - sdkmanager --version
  - chmod +x ./gradlew

detekt:
  stage: test
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk-root/
  script:
    - ./gradlew detekt


unit-tests:
  stage: test
  needs: [ lintDebug ]
  rules:
    - when: manual
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk-root/
  script:
    - ./gradlew testDebugUnitTest

lintDebug:
  interruptible: true
  stage: test
  needs: [ detekt ]
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk-root/
  script:
    - ./gradlew -Pci --console=plain :app:lintDebug -PbuildDir=lint
  artifacts:
    paths:
      - app/lint/reports/lint-results-debug.html
    expose_as: "lint-report"
    when: always

ui-tests:
  stage: ui-tests
  needs: [ lintDebug,detekt ]
  rules:
    - when: manual
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk-root/
  tags:
    - saas-linux-medium-amd64
  artifacts:
    when: always
    paths:
      - allure-results/
      - allure-report/
    reports:
      junit: app/build/outputs/androidTest-results/**/*.xml


  script:
    # Устанавливаем зависимости эмулятора, system image и расширяем PATH
    - apt-get --quiet install --yes libgl1 libpulse0
    - sdkmanager "emulator"
    - sdkmanager "system-images;android-33;google_apis;x86_64"
    - export PATH=$PATH:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools
    # Включаем KVM для аппаратного ускорения эмулятора
    - echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | tee /etc/udev/rules.d/99-kvm4all.rules
    - udevadm control --reload-rules
    - udevadm trigger --name-match=kvm
    # Создаём виртуальное устройство (AVD)
    - echo "no" | avdmanager create avd -n test -k "system-images;android-33;google_apis;x86_64" --force
    # Запускаем эмулятор в фоне и ждём полной загрузки
    - $ANDROID_HOME/emulator/emulator -avd test -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot-save &
    - adb wait-for-device
    - adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done; echo "Emulator ready"'
    # Отключаем анимации для стабильности тестов
    - adb shell settings put global window_animation_scale 0
    - adb shell settings put global transition_animation_scale 0
    - adb shell settings put global animator_duration_scale 0
    # Запускаем UI-тесты; set +e чтобы продолжить сбор артефактов даже при падении тестов
    - set +e;./gradlew :app:connectedDebugAndroidTest;TEST_RESULT=$?;set -e
    # Отладка: проверяем наличие Allure-файлов на устройстве и вытаскиваем результаты
    - adb shell ls /sdcard/Android/data/ 2>&1 | grep habitflow || echo "NOT FOUND:com.example.habitflow not in Android/data/"
    - adb shell find /sdcard -name "*allure*" 2>&1 || echo "Nothing found"
    - adb pull /sdcard/Android/data/com.example.habitflow/files/allure-results ./allure-results || true
    # Генерируем HTML-отчёт Allure и выходим с кодом результата тестов
    - wget -q https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
    - tar -zxf allure-2.27.0.tgz
    - ./allure-2.27.0/bin/allure generate allure-results --clean -o allure-report
    - exit $TEST_RESULT


build:
  stage: build
  needs: [ ui-tests ]
  rules:
    - when: manual
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - android-sdk-root/
  artifacts:
    when: always
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 7 days
  script:
    - ./gradlew assembleDebug



